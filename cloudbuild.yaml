# Trigger substitutions must provide _REGION and _RNG_SECRET_VERSION.
# A failed Docker test or build stage stops the image push and deployment.
steps:
  - id: build-and-test
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rng/rng:${COMMIT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rng/rng:${COMMIT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rng
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/rng/rng:${COMMIT_SHA}
      - --service-account=rng-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --update-env-vars=FIRESTORE_DATABASE_ID=rng-chain
      - --update-secrets=RNG_API_KEY=rng-api-key:${_RNG_SECRET_VERSION}
      - --no-invoker-iam-check
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
